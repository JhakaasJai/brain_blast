version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smaran-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-me-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smaran-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# No Postgres container — prototype uses in-memory data (mock_data.py)
# To add Postgres: uncomment below and update backend DATABASE_URL env var
#
#   db:
#     image: postgres:16
#     container_name: smaran-db
#     environment:
#       POSTGRES_DB: smaran
#       POSTGRES_USER: postgres
#       POSTGRES_PASSWORD: yourpassword
#     volumes:
#       - pgdata:/var/lib/postgresql/data
#     ports:
#       - "5432:5432"
#
# volumes:
#   pgdata:
